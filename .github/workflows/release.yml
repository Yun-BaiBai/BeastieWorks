# B5: build the Windows installer on GitHub's own Windows machines, so SignPath can sign it.
#
# SignPath Foundation (free code signing for open-source projects) signs only files built automatically from this
# repository on GitHub-hosted runners, and checks that the file came from this workflow. Until the project is approved
# and the repository variables below are set, the signing step is skipped and the unsigned installer is kept.
#
# A pushed version tag (v1.2.3) is published here too (老板 2026-11-28: GitHub makes the release itself, so the
# installer never travels through anyone's computer). The notes come from release-notes/<tag>.md, and the installer's
# sha256 is added. The tag is pushed only when the boss says to release. A run started by hand only builds, unless it
# names a tag already pushed (the release is then made for that tag from the code it was started on).
#
# Repository settings once SignPath approves (Settings → Secrets and variables → Actions):
#   variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#   secret:    SIGNPATH_API_TOKEN
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish the release for this existing tag (v1.2.3); empty: only build'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  actions: read
  # To create the release (the last step, tag pushes only).
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      MAGPIE_URL: https://github.com/yetone/magpie/releases/download/v0.1.1336/magpie-cli-windows-amd64.exe
      MINGIT_URL: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/MinGit-2.56.1-64-bit.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The programs that ship with the app. tools/prepare-*.cjs check each against its pinned sha256 and stop on any
      # difference, so what goes into the installer is exactly the published release.
      - name: Fetch Magpie and MinGit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          Invoke-WebRequest $env:MAGPIE_URL -OutFile downloads/magpie-v0.1.1336.exe
          Invoke-WebRequest $env:MINGIT_URL -OutFile downloads/MinGit-2.56.1-64-bit.zip
          "BEASTIE_MAGPIE_EXE=$PWD\downloads\magpie-v0.1.1336.exe" >> $env:GITHUB_ENV
          "BEASTIE_MINGIT_ZIP=$PWD\downloads\MinGit-2.56.1-64-bit.zip" >> $env:GITHUB_ENV

      # Every automatic test must pass before anything is packaged (C3 review, finding 17). They run under the app's own
      # Electron, call no model, and use the Magpie fetched above for the gateway tests.
      - name: Test
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:AGENTCORP_TEST_MAGPIE_EXE = $env:BEASTIE_MAGPIE_EXE
          $tests = Get-ChildItem test -Recurse -Filter *.test.cjs | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1).Replace('\', '/') }
          # electron.exe is a windowed program: PowerShell does not wait for it with `&`, so the first run ended the step
          # after 11 tests and still passed. Wait for it, as the local test script does, and require the summary line.
          $p = Start-Process -FilePath node_modules/electron/dist/electron.exe -ArgumentList (@('--test', '--test-reporter=tap') + $tests) -NoNewWindow -PassThru -RedirectStandardOutput test-out.log -RedirectStandardError test-err.log
          $null = $p.Handle
          $p.WaitForExit()
          Get-Content test-err.log -Tail 20
          Select-String -Path test-out.log -Pattern '^not ok|^# (tests|pass|fail|skipped) ' | ForEach-Object Line
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (-not (Select-String -Path test-out.log -Pattern '^# fail 0$' -Quiet)) { Write-Error 'the test summary is missing'; exit 1 }

      - name: Build the installer
        run: npm run dist:win -- --publish never

      - name: Keep the unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/Beastie-Works-*-win-x64-setup.exe
          if-no-files-found: error

      # Each release is approved by hand in SignPath before it is signed (SignPath's rule).
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Keep the signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-signed
          path: signed
          if-no-files-found: error

      - name: Publish the release
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { Write-Error "tag $env:TAG does not match package.json $version"; exit 1 }
          $notes = "release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { Write-Error "missing $notes"; exit 1 }
          # The signed installer when SignPath signed one, otherwise the unsigned one.
          $exe = Get-ChildItem signed, dist -Filter "Beastie-Works-$version-win-x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error 'installer missing'; exit 1 }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $body = (Get-Content $notes -Raw -Encoding utf8).TrimEnd() + "`n`nSHA256: ``$sha`` (GitHub run $env:GITHUB_RUN_ID, all tests passed before packaging)`n"
          Set-Content -Path release-body.md -Value $body -Encoding utf8NoBOM
          gh release create $env:TAG $exe.FullName --verify-tag --title "小怪工坊 Beastie Works $version" --notes-file release-body.md
