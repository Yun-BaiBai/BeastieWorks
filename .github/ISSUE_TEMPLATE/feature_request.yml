# Adapted from Orca's feature request form (stablyai/orca, MIT).
name: 想要的功能 / Feature request
description: 想让小怪工坊多做点什么 / Something you'd like Beastie Works to do
title: '[想法 Idea]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 ROADMAP.md，也许已经在计划里了。中文、英文都行。
        Check ROADMAP.md first; it may already be planned. Chinese or English is fine.

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / The problem
      description: 你在做什么事的时候卡住了，或者觉得麻烦 / What you were doing when it got in the way
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法 / What you have in mind
      description: 可以不写；有别的软件已经这么做了的话，贴个链接 / Optional; link another tool that does it, if any
    validations:
      required: false
